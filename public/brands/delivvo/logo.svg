<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Delivvo">
  <!-- Static favicon fallback. Geometry mirrors src/app/icon.tsx —
       circular navy disc, vector "D", two-layer live-indicator amber
       dot at the upper-right (wordmark x-height position).

       The "D" is a vector <path> rather than <text> because browsers
       don't load web fonts inside SVG; using <text font-family="Unbounded">
       falls back to system Helvetica and reads as generic. The path
       traces a bold-sans "D" by hand so the geometry is locked. -->
  <circle cx="32" cy="32" r="32" fill="#000000"/>
  <path fill="#FFFFFF" fill-rule="evenodd" d="M14 16 H30 C40.493 16 49 23.163 49 32 C49 40.837 40.493 48 30 48 H14 Z M20 22 V42 H30 C37.18 42 43 37.523 43 32 C43 26.477 37.18 22 30 22 H20 Z"/>
  <!-- Live-indicator dot — outer lighter halo + inner solid amber.
       Two stacked <circle>s give a pixel-crisp halo (vs. SVG drop-shadow,
       which Safari rasterises inconsistently on small favicon sizes). -->
  <circle cx="55" cy="22" r="6" fill="#F0B429" fill-opacity="0.24"/>
  <circle cx="55" cy="22" r="3.5" fill="#F0B429"/>
</svg>
